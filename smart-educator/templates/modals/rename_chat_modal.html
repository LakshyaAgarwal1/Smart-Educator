<div id="renameModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded w-full max-w-md p-6">
    <h3 class="text-lg font-semibold">Rename Chat</h3>
    <form id="rename-form" class="mt-4">
      <div class="mb-3">
        <label class="block text-sm mb-1">New title</label>
        <input name="title" class="w-full border px-3 py-2 rounded" />
      </div>
      <div class="flex justify-end space-x-2">
        <button type="button" data-modal-close="#renameModal" class="px-4 py-2 border rounded">Cancel</button>
        <button type="submit" class="px-4 py-2 bg-primary text-white rounded">Save</button>
      </div>
    </form>
  </div>
</div>
