<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ document.display_name }}</title>
</head>
<body>
    <h1>{{ document.display_name }}</h1>
    <p>Type: {{ document.file_type }}</p>
    <p>Status: {{ document.status }}</p>
    <p>Source: {{ document.source }}</p>
    <p>Size: {{ document.file_size }} bytes</p>
    <p>Hash: {{ document.file_hash }}</p>
    <p><a href="{% url 'document_list' %}">Back</a></p>
</body>
</html>
