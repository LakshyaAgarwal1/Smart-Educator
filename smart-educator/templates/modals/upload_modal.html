<div id="uploadModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded w-full max-w-lg p-6">
    <h3 class="text-lg font-semibold">Upload Document</h3>
    <form id="upload-form" class="mt-4" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="block text-sm mb-1">Title (optional)</label>
        <input id="upload-title" name="title" class="w-full border px-3 py-2 rounded" />
      </div>

      <div id="drop-zone" class="mb-3 border-2 border-dashed border-gray-200 rounded p-6 text-center">
        <div class="text-sm text-muted">Drag & drop files here, or <button type="button" id="choose-file" class="underline">browse</button></div>
        <input id="upload-file-input" name="file" type="file" class="hidden" />
        <div id="upload-file-name" class="mt-2 text-sm"></div>
      </div>

      <div id="upload-progress" class="hidden mt-3">
        <div class="w-full bg-gray-100 rounded h-3 overflow-hidden"><div id="upload-progress-bar" class="bg-primary h-3 w-0"></div></div>
        <div id="upload-progress-text" class="text-sm text-muted mt-1">0%</div>
      </div>

      <div class="flex justify-end space-x-2 mt-4">
        <button type="button" data-modal-close="#uploadModal" class="px-4 py-2 border rounded">Cancel</button>
        <button type="submit" id="upload-submit" class="px-4 py-2 bg-primary text-white rounded">Upload</button>
      </div>
    </form>
  </div>
</div>
