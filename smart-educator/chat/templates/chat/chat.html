<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat</title>
</head>
<body>
    <h1>{{ chat.title }}</h1>
    <p><a href="{% url 'chat_list' %}">Back to chats</a></p>

    <div style="margin-bottom: 20px;">
        {% for message in messages %}
            <div><strong>{{ message.role }}:</strong> {{ message.content }}</div>
        {% empty %}
            <p>No messages yet.</p>
        {% endfor %}
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form.message }}
        <button type="submit">Send</button>
    </form>
</body>
</html>
