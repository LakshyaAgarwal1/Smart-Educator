<div class="p-4 flex flex-col h-full">
  <div class="mb-6">
    <a href="/" class="text-xl font-semibold text-primary">Smart Educator</a>
  </div>

  <nav class="flex-1">
    <ul class="space-y-1">
      <li><a href="/" class="block px-3 py-2 rounded hover:bg-gray-100">Dashboard</a></li>
      <li><a href="/documents/" class="block px-3 py-2 rounded hover:bg-gray-100">Documents</a></li>
      <li><a href="/chat/" class="block px-3 py-2 rounded hover:bg-gray-100">Chat</a></li>
      <li><a href="/accounts/profile/" class="block px-3 py-2 rounded hover:bg-gray-100">Profile</a></li>
      <li><a href="/accounts/profile/#settings" class="block px-3 py-2 rounded hover:bg-gray-100">Settings</a></li>
    </ul>
  </nav>

  <div class="mt-4">
    <button id="new-chat-btn" class="w-full inline-flex items-center justify-center px-3 py-2 bg-primary text-white rounded">New Chat</button>
    <button id="upload-btn" data-modal-target="#uploadModal" class="w-full mt-2 inline-flex items-center justify-center px-3 py-2 border rounded">Upload</button>
  </div>
 
  {% if recent_chats %}
    <div class="mt-6">
      <h4 class="text-sm font-semibold px-3 mb-2">Recent Chats</h4>
      <ul class="text-sm">
        {% for c in recent_chats %}
          <li class="px-3 py-2 hover:bg-gray-100 rounded">
            <a href="/chat/{{ c.id }}/" data-chat-id="{{ c.id }}">{{ c.title|default:'Untitled' }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}
</div>
