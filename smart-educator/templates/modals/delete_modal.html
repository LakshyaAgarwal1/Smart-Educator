<div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded w-full max-w-md p-6">
    <h3 class="text-lg font-semibold text-danger">Delete Item</h3>
    <p class="text-sm mt-2">Are you sure you want to delete this item? This action cannot be undone.</p>
    <div class="flex justify-end space-x-2 mt-4">
      <button type="button" data-modal-close="#deleteModal" class="px-4 py-2 border rounded">Cancel</button>
      <button id="confirm-delete" class="px-4 py-2 bg-danger text-white rounded">Delete</button>
    </div>
  </div>
</div>
