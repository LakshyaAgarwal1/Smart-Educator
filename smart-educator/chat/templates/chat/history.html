<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chat History</title>
</head>
<body>
    <h1>Chat History</h1>
    <ul>
        {% for chat in chats %}
            <li><a href="{% url 'chat_detail' chat.id %}">{{ chat.title }}</a> - {{ chat.updated_at }}</li>
        {% empty %}
            <li>No conversations yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
